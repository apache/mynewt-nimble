syscfg.defs:
    BLE_LL_ISO_BROADCAST_SYNC_MAX_BIG:
        description: Use BLE_LL_ISO_BROADCAST_SYNC_MAX_BIGS instead
        value: 0
        deprecated: 1
    BLE_LL_ISO_BROADCAST_SYNC_MAX_BIS:
        description: >
            Use BLE_LL_ISO_BROADCAST_SYNC_MAX_BISES instead, which is the total
            number of BISes in all BIGs
        value: 0
        deprecated: 1
    BLE_LL_CFG_FEAT_LL_PERIODIC_ADV_SYNC_CNT:
        description: Use BLE_LL_MAX_PERIODIC_SYNCS instead
        value: 0
        deprecated: 1

syscfg.vals.BLE_LL_ISO_BROADCAST_SYNC_MAX_BIG:
    BLE_LL_ISO_BROADCAST_SYNC_MAX_BIGS: MYNEWT_VAL(BLE_LL_ISO_BROADCAST_SYNC_MAX_BIG)

syscfg.vals.BLE_LL_ISO_BROADCAST_SYNC_MAX_BIS:
    BLE_LL_ISO_BROADCAST_SYNC_MAX_BISES: 'MYNEWT_VAL_BLE_LL_ISO_BROADCAST_SYNC_MAX_BIGS * MYNEWT_VAL_BLE_LL_ISO_BROADCAST_SYNC_MAX_BIS'

syscfg.vals.BLE_LL_CFG_FEAT_LL_PERIODIC_ADV_SYNC_CNT:
    BLE_LL_MAX_PERIODIC_SYNCS: MYNEWT_VAL(BLE_LL_CFG_FEAT_LL_PERIODIC_ADV_SYNC_CNT)
