pkg.name: babblesim/runner
pkg.type: sdk
pkg.description: >
    BabbleSim specific native simulator runner extensions (command line,
    Phy synchronization, exit handling). Based on Zephyr nrf_bsim boards.
pkg.author: "Apache Mynewt <dev@mynewt.apache.org>"
pkg.homepage: "https://mynewt.apache.org/"

# Registered via native simulator tasks and HW events (linker sections) only.
pkg.whole_archive: true

pkg.deps:
    - "@apache-mynewt-nimble/babblesim/ext/bsim"
    - "@apache-mynewt-nimble/babblesim/ext/native_simulator"
    - "@apache-mynewt-nimble/babblesim/ext/nrf_hw_models"

pkg.cflags:
    - -std=gnu11
    - -DNSI_RUNNER_BUILD
    - -DNSI_N_CPUS=1
    - -DNSI_PRIMARY_MCU_N=0

pkg.private_include_dirs:
    - "@babblesim-native_simulator/common/src"
    - "@babblesim-nrf_hw_models/src/HW_models"
