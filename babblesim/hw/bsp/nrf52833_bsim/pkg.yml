pkg.name: babblesim/hw/bsp/nrf52833_bsim
pkg.type: bsp
pkg.description: nRF52833 on BabbleSim (native simulator based)
pkg.author: "Apache Mynewt <dev@mynewt.apache.org>"
pkg.homepage: "https://mynewt.apache.org/"

pkg.cflags:
    - '-DNRF52833_XXAA'
    - '-DNRF52833'
    - '-DINTEGRATOR_PROVIDES_CMSIS'
    - '-DBABBLESIM'

pkg.deps:
    - "@apache-mynewt-nimble/babblesim/hw/mcu/nordic/nrf52833_bsim"

pkg.deps.UART_0:
    - "@apache-mynewt-core/hw/drivers/uart/uart_hal"
