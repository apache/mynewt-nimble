pkg.name: babblesim/ext/bsim
pkg.type: sdk
pkg.description: BabbleSim base libraries required to connect to BabbleSim phy
pkg.author: "Apache Mynewt <dev@mynewt.apache.org>"
pkg.homepage: "https://babblesim.github.io/"

pkg.cflags:
    - -std=gnu99
    - -Wno-unused-result
    # Do not fail optimized builds on warnings in external code
    - -Wno-error=stringop-truncation

pkg.include_dirs:
    - "@babblesim-base/libUtilv1/src"
    - "@babblesim-base/libPhyComv1/src"
    - "@babblesim-base/libRandv2/src"
    - "@babblesim-ext_2G4_libPhyComv1/src"

pkg.source_files:
    - "@babblesim-base/libUtilv1/src/bs_cmd_line.c"
    - "@babblesim-base/libUtilv1/src/bs_cmd_line_typical.c"
    - "@babblesim-base/libUtilv1/src/bs_dump_files.c"
    - "@babblesim-base/libUtilv1/src/bs_dynargs.c"
    - "@babblesim-base/libUtilv1/src/bs_oswrap.c"
    - "@babblesim-base/libUtilv1/src/bs_results.c"
    - "@babblesim-base/libUtilv1/src/bs_string.c"
    - "@babblesim-base/libUtilv1/src/bs_symbols.c"
    - "@babblesim-base/libUtilv1/src/bs_tracing.c"
    - "@babblesim-base/libPhyComv1/src/bs_pc_backchannel.c"
    - "@babblesim-base/libPhyComv1/src/bs_pc_base.c"
    - "@babblesim-base/libRandv2/src/bs_rand_main.c"
    - "@babblesim-ext_2G4_libPhyComv1/src/bs_pc_2G4.c"
    - "@babblesim-ext_2G4_libPhyComv1/src/bs_pc_2G4_priv.c"
    - "@babblesim-ext_2G4_libPhyComv1/src/bs_pc_2G4_stateless.c"
    - "@babblesim-ext_2G4_libPhyComv1/src/bs_pc_2G4_stateless_wo_callbacks.c"
    - "@babblesim-ext_2G4_libPhyComv1/src/bs_pc_2G4_utils.c"

repository.babblesim-base:
    type: github
    vers: 68baf150660213d67c29acb14bf9fccecf4612eb-commit
    branch: master
    user: BabbleSim
    repo: base

