pkg.name: babblesim/ext/nrf_hw_models
pkg.type: sdk
pkg.description: BabbleSim nRF HW models (built in native simulator runner context)
pkg.author: "Apache Mynewt <dev@mynewt.apache.org>"
pkg.homepage: "https://github.com/BabbleSim/ext_nRF_hw_models"

# HW models register themselves via native simulator tasks and HW events
# (linker sections) so nothing references them directly.
pkg.whole_archive: true

pkg.deps:
    - "@apache-mynewt-nimble/babblesim/ext/bsim"
    - "@apache-mynewt-nimble/babblesim/ext/native_simulator"

pkg.cflags:
    - -std=gnu11
    # Do not fail optimized builds on warnings in external code
    - -Wno-error=strict-aliasing
    - -D_XOPEN_SOURCE=500
    - -DNRF52833_XXAA
    - -DNRF52833

pkg.private_include_dirs:
    - "@babblesim-native_simulator/common/src"
    - "@babblesim-nrf_hw_models/src/HW_models"
    - "@babblesim-nrf_hw_models/src/nrfx_config"
    - "@babblesim-nrf_hw_models/src/nrfx/mdk_replacements"
    - "@babblesim-nrf_hw_models/src/nrfx/nrfx_replacements"
    - "@nordic-nrfx/."
    - "@nordic-nrfx/bsp/stable"
    - "@nordic-nrfx/bsp/stable/mdk"

pkg.source_files:
    - "@babblesim-nrf_hw_models/src/HW_models/BLECrypt_if.c"
    - "@babblesim-nrf_hw_models/src/HW_models/HW_utils.c"
