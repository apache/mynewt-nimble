name: Restore ccache
description: >
  Install ccache, put it in front of compilers used by newt and restore
  ccache directory from cache. Must be used after toolchain is installed
  so that ccache wrappers are found in PATH before real compilers.
  Supported only on Linux, does nothing on other systems.

inputs:
  key:
    description: Cache key, unique for job (and matrix entry)
    required: true
  max-size:
    description: Maximum size of ccache directory
    required: false
    default: 500M

runs:
  using: composite
  steps:
    - name: Set up ccache
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v ccache > /dev/null; then
          sudo apt-get update
          sudo apt-get install -y ccache
        fi
        # Wrappers named as compilers used by newt, ccache finds real
        # compiler by skipping its own directory in PATH.
        dir="$RUNNER_TEMP/ccache-bin"
        mkdir -p "$dir"
        for c in arm-none-eabi-gcc arm-none-eabi-g++ gcc g++; do
          ln -sf "$(command -v ccache)" "$dir/$c"
        done
        echo "$dir" >> "$GITHUB_PATH"
        {
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          echo "CCACHE_NOHASHDIR=true"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_MAXSIZE=${{ inputs.max-size }}"
          echo "CCACHE_JOB_START=$(date +%s)"
        } >> "$GITHUB_ENV"

    - name: Restore ccache directory
      if: runner.os == 'Linux'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/ccache
        key: ccache-${{ inputs.key }}-${{ github.sha }}
        restore-keys: ccache-${{ inputs.key }}-

    - name: Reset ccache statistics
      if: runner.os == 'Linux'
      shell: bash
      run: |
        ccache --version | head -1
        ccache --zero-stats
