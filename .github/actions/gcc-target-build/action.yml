name: Build GCC test target
description: >
  Install given release of GNU Arm Embedded Toolchain, build cc_test
  target with it and remove it afterwards. Used to build test target with
  many toolchain releases in single job. Expects project with cc_test
  target restored in build directory and ccache restored.

inputs:
  release:
    description: GNU Arm Embedded Toolchain release name
    required: true

runs:
  using: composite
  steps:
    - name: Install toolchain
      id: gcc
      uses: carlosperate/arm-none-eabi-gcc-action@v1.14.0
      with:
        release: ${{ inputs.release }}

    - name: Build target
      shell: bash
      env:
        GCC_PATH: ${{ steps.gcc.outputs.path }}
      run: |
        # Toolchain action only prepends to PATH so it also contains
        # previously installed releases. Set PATH explicitly, ccache
        # wrappers first so that they find this toolchain as next one.
        export PATH="$RUNNER_TEMP/ccache-bin:$GCC_PATH:$PATH"
        arm-none-eabi-gcc --version | head -1
        cd build
        # Command lines are same for all releases, so newt would not
        # rebuild objects built with previous toolchain release.
        rm -rf bin
        newt build cc_test

    - name: Remove toolchain
      if: always() && steps.gcc.outputs.path != ''
      shell: bash
      env:
        GCC_PATH: ${{ steps.gcc.outputs.path }}
      run: |
        # Toolchain is installed in directory in home directory
        dir="${GCC_PATH#"$HOME"/}"
        rm -rf "$HOME/${dir%%/*}"
