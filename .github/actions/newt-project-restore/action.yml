name: Restore newt project
description: >
  Restore newt and newt project prepared by prepare job of the same
  workflow run, so that external repositories are downloaded only once
  per run. Project contains only .git directories of repositories,
  working trees are checked out after restore.

inputs:
  path:
    description: Directory to restore project to
    required: false
    default: build

runs:
  using: composite
  steps:
    - name: Download project
      uses: actions/download-artifact@v8
      with:
        name: newt-project
        path: ${{ runner.temp }}/newt-project

    - name: Extract project
      shell: bash
      run: |
        mkdir -p "${{ inputs.path }}"
        zstd -d -c "$RUNNER_TEMP/newt-project/newt-project.tar.zst" | tar -x -C "${{ inputs.path }}"
        rm -rf "$RUNNER_TEMP/newt-project"
        mv "${{ inputs.path }}/.newt-bin" "$GITHUB_WORKSPACE/.newt-bin"
        echo "$GITHUB_WORKSPACE/.newt-bin" >> "$GITHUB_PATH"
        bash "$GITHUB_WORKSPACE/.github/scripts/checkout_repos.sh" "${{ inputs.path }}"

    # Project was set up and upgraded by prepare job for tested commit
    - name: Show project info
      shell: bash
      run: |
        cd "${{ inputs.path }}"
        newt info
