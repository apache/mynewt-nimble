# NimBLE uses the same coding style options as apache-mynewt-core, this keeps
# .mynewt-format a copy of the one there. .mynewt-format-ignore is NimBLE's own.

name: Sync mynewt-format

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write

    if: github.event.repository.fork == false
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v7

      - name: Download .mynewt-format from source
        run: |
          wget -O .mynewt-format-core https://raw.githubusercontent.com/apache/mynewt-core/refs/heads/master/.mynewt-format

      - name: Check for changes & replace
        id: changed
        run: |
          set +e
          if ! cmp -s ".mynewt-format-core" ".mynewt-format"; then
            echo "🔄 .mynewt-format has changed, updating..."
            diff -u .mynewt-format .mynewt-format-core
            mv .mynewt-format-core .mynewt-format
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "✅ No changes detected."
            rm .mynewt-format-core
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changed.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          author: Mynewt Bot <dev@mynewt.apache.org>
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            mynewt-format: Update .mynewt-format from apache-mynewt-core

            Keep NimBLE on the same coding style options as mynewt-core.
          branch: update-mynewt-format
          title: "Update .mynewt-format from apache-mynewt-core"
          body: |
            Syncing the latest .mynewt-format file from apache-mynewt-core

            [1]: https://github.com/peter-evans/create-pull-request
