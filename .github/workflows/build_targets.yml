name: Targets

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  targets:
    name: Build all test targets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: carlosperate/arm-none-eabi-gcc-action@v1.14.0
        with:
          release: '15.2.Rel1'
      - name: Install Dependencies
        shell: bash
        if: matrix.os == 'ubuntu-latest'
        run: |
             sudo apt-get update
             sudo apt-get install -y gcc-multilib ccache
      - name: Install newt
        uses: ./.github/actions/newt-install
      - name: Set up project
        uses: ./.github/actions/newt-project
      - name: Remove project targets
        shell: bash
        run: rm -rf build/targets
      - name: Restore ccache
        uses: ./.github/actions/ccache-restore
        with:
          key: targets
      - name: Build targets
        shell: bash
        run: |
             cp -r .github/targets build/targets
             cd build
             ls targets | xargs -n1 sh -c 'echo "Testing $0"; newt build -q $0'
             rm -rf targets
             cd ..
      - name: Build Linux-only targets
        shell: bash
        if: matrix.os == 'ubuntu-latest'
        run: |
             cp -r .github/targets_linux build/targets
             cd build
             ls targets | xargs -n1 sh -c 'echo "Testing $0"; newt build -q  $0'
             rm -rf targets
             cd ..
      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          key: targets
