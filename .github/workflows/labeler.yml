name: "Pull Request Size Labeler"
on:
  - pull_request_target

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    # pr-size-labeler is Docker action which is not supported by
    # ubuntu-slim runner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Assign labels based on the PR's size
        uses: codelytv/pr-size-labeler@19c335e7695ba922de938806dd129f0a9b992644 # v1.12.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ignore_file_deletions: true
          # Label only, don't comment on XL pull requests
          message_if_xl: ''
