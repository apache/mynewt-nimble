name: BabbleSim

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  targets:
    name: Build and test BabbleSim targets
    runs-on: ubuntu-latest
    env:
      BSIM_OUT_PATH: ${{ github.workspace }}/babblesim
      BSIM_COMPONENTS_PATH: ${{ github.workspace }}/babblesim/components
      NRFX_BASE: ${{ github.workspace }}/nrfx
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false
      - name: Install Dependencies
        shell: bash
        run: |
             sudo apt-get update
             sudo apt-get install -y gcc-multilib
      - name: Install newt
        shell: bash
        run: |
             go version
             go install mynewt.apache.org/newt/newt@latest
      - name: Install BabbleSim
        shell: bash
        run: |
             mkdir -p ~/bin
             curl -sSfL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
             chmod a+x ~/bin/repo
             mkdir -p ${BSIM_OUT_PATH}
             cd ${BSIM_OUT_PATH}
             ~/bin/repo init -u https://github.com/BabbleSim/manifest.git -m everything.xml -b master
             ~/bin/repo sync -c -j$(nproc)
             # Legacy nRF52 HW models (newer ext_nRF_hw_models require native simulator)
             git clone --depth 1 https://github.com/BabbleSim/ext_NRF52_hw_models.git components/ext_NRF52_hw_models
             # Legacy HW models require nrfx 3.x
             git clone --depth 1 -b v3.1.0 https://github.com/NordicSemiconductor/nrfx.git ${NRFX_BASE}
             make everything -j$(nproc)
      - name: Setup project
        shell: bash
        run: |
             newt new build
             cp -f .github/project.yml build/project.yml
             cd build
             newt upgrade --shallow=1
             rm -rf targets
             rm -rf repos/apache-mynewt-nimble
             git clone .. repos/apache-mynewt-nimble
             # Fetch external repositories declared by NimBLE packages. newt
             # does not upgrade repository with commits not pushed upstream,
             # so put tested commit on a branch tracking upstream master to
             # keep it checked out.
             cd repos/apache-mynewt-nimble
             git remote set-url origin https://github.com/apache/mynewt-nimble.git
             git fetch -q origin master
             git checkout -q -B ci-build
             git branch -q --set-upstream-to=origin/master
             cd ../..
             newt upgrade --shallow=1
      - name: Build targets
        shell: bash
        run: |
             cd build
             ls repos/apache-mynewt-nimble/babblesim/targets | xargs -n1 sh -c 'echo "Testing $0"; newt build -q @apache-mynewt-nimble/babblesim/targets/$0'
      - name: Run tests
        shell: bash
        run: |
             cd build
             repos/apache-mynewt-nimble/babblesim/tests/run_all.sh
