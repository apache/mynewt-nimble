name: Compliance check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  style_license:
    name: Licensing
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Dependencies
        shell: bash
        run: |
             mkdir repos
             git clone --depth=1 https://github.com/apache/mynewt-core repos/apache-mynewt-core
             wget https://archive.apache.org/dist/creadur/apache-rat-0.18/apache-rat-0.18-bin.tar.gz
             tar zxf apache-rat-0.18-bin.tar.gz apache-rat-0.18/apache-rat-0.18.jar
             mv apache-rat-0.18/apache-rat-0.18.jar apache-rat.jar
      - name: Check licensing
        shell: bash
        run: |
             ./repos/apache-mynewt-core/.github/check_license.py

  style_doxygen:
    name: Doxygen Style
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Dependencies
        id: install
        shell: bash
        timeout-minutes: 3
        continue-on-error: true
        run: |
             sudo apt-get update
             sudo apt-get install -y doxygen graphviz
      - name: Install Dependencies (fallback mirror)
        if: steps.install.outcome == 'failure'
        shell: bash
        run: |
             # https://github.com/actions/runner-images/issues/14823
             sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
             # Timeout may have interrupted dpkg in previous step, which makes
             # apt-get refuse to install anything until this is run. No-op if
             # dpkg was not interrupted.
             sudo dpkg --configure -a
             sudo apt-get update
             sudo apt-get install -y doxygen graphviz
      - name: Check Doxygen
        shell: bash
        run: |
             .github/check_doxygen.py

  commits-check:
    name: Check commit messages
    runs-on: ubuntu-slim
    steps:
      # Pull request head instead of merge commit, which would be checked
      # as a merge commit
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: apache/mynewt-core/.github/actions/commit-check@master

  style_check_mynewt_format:
    name: Coding style (mynewt-format)
    runs-on: ubuntu-slim
    steps:
      # Pull request head instead of merge commit, so that reported lines
      # match lines of review comments
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # Runs mynewt-format of the same apache-mynewt-core ref as the action
      - uses: apache/mynewt-core/.github/actions/mynewt-format-check@master
