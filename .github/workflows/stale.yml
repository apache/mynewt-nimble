# Marks pull requests without activity for 12 months as stale. Stale pull
# requests are never closed, stale label is removed by next run after any
# update or comment. Pull request maintenance workflow skips stale pull
# requests until new commit is pushed.

name: Stale pull requests

on:
  schedule:
    - cron: '30 2 1 * *'
  workflow_dispatch:

permissions:
  # Required for storing action state between runs
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  stale:
    if: github.repository == 'apache/mynewt-nimble'
    runs-on: ubuntu-slim
    timeout-minutes: 60
    steps:
      - uses: actions/stale@v11
        with:
          # Keep in sync with MAX_AGE_DAYS in pr_maintenance.py
          days-before-pr-stale: 365
          days-before-pr-close: -1
          days-before-issue-stale: -1
          days-before-issue-close: -1
          stale-pr-label: stale
          stale-pr-message: >-
            This pull request had no activity for 12 months and is marked
            as stale. If it is still valid, please rebase it on current
            base branch. Stale pull requests are not closed automatically,
            the label is removed on any update or comment.
          operations-per-run: 200
