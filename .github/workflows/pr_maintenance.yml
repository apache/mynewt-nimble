# Maintenance of open pull requests labels.
# This runs periodically from master instead of pull_request_target, so
# no pull request code or configuration is used with elevated privileges.

name: Pull request maintenance

on:
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  maintenance:
    if: github.repository == 'apache/mynewt-nimble'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Update pull requests labels
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pr_maintenance.py

      # Following step runs also if previous step failed, so that error in
      # one pull request doesn't block processing of others

      - name: Assign labels based on paths
        if: ${{ !cancelled() && steps.check.outputs.pr-numbers != '' }}
        uses: actions/labeler@v7
        with:
          pr-number: ${{ steps.check.outputs.pr-numbers }}
          sync-labels: true
          configuration-path: .github/labeler_cfg.yml
