# Posts problems found by mynewt-format check in Compliance check as review
# comments. Runs from master with write token, as pull_request runs of fork
# pull requests get read-only token. Pull request code is never checked out.

name: Coding style comments

on:
  workflow_run:
    workflows: ["Compliance check"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Comment mynewt-format problems
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-slim
    steps:
      - uses: apache/mynewt-core/.github/actions/mynewt-format-comments@master
