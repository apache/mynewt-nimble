syscfg.defs:
    LIBLC3_ENABLE_LTPF_RESAMPLE_8K:
        description: >
            Include resampler used by encoder LTPF analysis for 8 kHz
            sampling rate. Disable to save code size if encoder is never
            used with 8 kHz.
        value: 1
    LIBLC3_ENABLE_LTPF_RESAMPLE_16K:
        description: >
            Include resampler used by encoder LTPF analysis for 16 kHz
            sampling rate. Disable to save code size if encoder is never
            used with 16 kHz.
        value: 1
    LIBLC3_ENABLE_LTPF_RESAMPLE_24K:
        description: >
            Include resampler used by encoder LTPF analysis for 24 kHz
            sampling rate. Disable to save code size if encoder is never
            used with 24 kHz.
        value: 1
    LIBLC3_ENABLE_LTPF_RESAMPLE_32K:
        description: >
            Include resampler used by encoder LTPF analysis for 32 kHz
            sampling rate. Disable to save code size if encoder is never
            used with 32 kHz.
        value: 1
    LIBLC3_ENABLE_LTPF_RESAMPLE_48K:
        description: >
            Include resampler used by encoder LTPF analysis for 48 kHz
            sampling rate. Disable to save code size if encoder is never
            used with 48 kHz.
        value: 1
